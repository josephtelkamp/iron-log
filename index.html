<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Log</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

.header {
  background: #1b1b1b;
  padding: 25px;
  text-align: center;
  border-bottom: 2px solid #333;
}

.header h1 {
  margin: 0;
  font-size: 36px;
}

.header p {
  color: #aaa;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1d1d1d;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}

button {
  width: 100%;
  padding: 16px;
  margin: 7px 0;
  border: 0;
  border-radius: 10px;
  background: #292929;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

button:hover {
  background: #3a3a3a;
}

.exercise {
  border-top: 1px solid #333;
  padding: 15px 0;
}

.exercise h3 {
  margin-bottom: 5px;
}

.last {
  color: #aaa;
  margin-bottom: 10px;
}

.set {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0;
}

.set input {
  width: 80px;
  padding: 8px;
  background: #222;
  color: white;
  border: 1px solid #555;
  border-radius: 6px;
}

.set input[type="checkbox"] {
  width: 20px;
  height: 20px;
}

.back {
  background: #444;
}

.hidden {
  display: none;
}

.pr {
  padding: 10px 0;
  border-bottom: 1px solid #333;
}
</style>
</head>

<body>

<div class="header">
  <h1>🦾 IRON LOG</h1>
  <p>Track Every Rep. Earn Every PR.</p>
</div>

<div class="container">

  <div id="home">

    <div class="card">
      <h2>Welcome to Iron Log</h2>
      <p>Your personal fitness tracker.</p>
    </div>

    <div class="card">
      <h2>💪 Start Workout</h2>

      <button onclick="showWorkout('push')">Push Day</button>
      <button onclick="showWorkout('pull')">Pull Day</button>
      <button onclick="showWorkout('legs')">Leg Day</button>
      <button onclick="showWorkout('shoulders')">Shoulders</button>
      <button onclick="showWorkout('core')">Core</button>
    </div>

    <div class="card">
      <h2>🏆 Current PRs</h2>

      <div class="pr">Bench Press — <strong>125 × 10</strong></div>
      <div class="pr">Squat — <strong>175 × 10</strong></div>
      <div class="pr">Deadlift — <strong>135 × 10</strong></div>
      <div class="pr">Lat Pulldown — <strong>160 × 10</strong></div>
    </div>

  </div>


  <div id="workout" class="hidden">

    <button class="back" onclick="goHome()">← Back to Dashboard</button>

    <div class="card">
      <h2 id="workoutTitle"></h2>
      <p>Tap "Same as Last Workout" if nothing changed.</p>

      <button onclick="sameAsLast()">🔄 Same as Last Workout</button>

      <div id="exerciseList"></div>

      <button onclick="finishWorkout()">✅ Finish Workout</button>
    </div>

  </div>

</div>


<script>

const workouts = {

  push: {
    title: "💪 Push Day",
    exercises: [
      {
        name: "Bench Press",
        weight: 125,
        reps: 10,
        sets: 3,
        drops: "115 × 12, 105 × 12, 95 × 12, 85 × 12, 75 × 12, 65 × 12, 55 × 12, 45 × 12"
      },
      {
        name: "Incline Bench Press",
        weight: 95,
        reps: 10,
        sets: 3,
        drops: "85 × 12, 75 × 12, 65 × 12, 55 × 12, 45 × 12"
      },
      {
        name: "Seated Cable Fly",
        weight: 50,
        reps: 10,
        sets: 3,
        drops: "40 × 12, 30 × 15, 20 × 15"
      },
      {
        name: "Tricep Rope Extension",
        weight: 90,
        reps: 10,
        sets: 3,
        drops: "80 × 12, 70 × 12, 60 × 12, 50 × 12, 40 × 15, 30 × 15, 20 × 15"
      },
      {
        name: "Behind the Head Tricep Extension",
        weight: 70,
        reps: 10,
        sets: 3,
        drops: "60 × 12, 50 × 12, 40 × 12, 30 × 12, 20 × 15"
      }
    ]
  },

  pull: {
    title: "💪 Pull Day",
    exercises: [
      {
        name: "Wide Grip Lat Pulldown",
        weight: 160,
        reps: 10,
        sets: 3,
        drops: "150 × 12, 140 × 12, 130 × 12, 120 × 12, 110 × 12, 100 × 12"
      },
      {
        name: "Seated Row",
        weight: 140,
        reps: 10,
        sets: 3,
        drops: "130 × 12, 120 × 12, 110 × 12, 100 × 12, 90 × 12, 80 × 12"
      },
      {
        name: "Rope Face Pulls",
        weight: 70,
        reps: 10,
        sets: 3,
        drops: "60 × 12, 50 × 12, 40 × 12, 30 × 12, 20 × 12"
      },
      {
        name: "Bent Over Barbell Rows",
        weight: 135,
        reps: 10,
        sets: 3,
        drops: "125 × 12, 115 × 12, 105 × 12, 95 × 12, 85 × 12, 75 × 12, 65 × 12, 55 × 12, 45 × 12"
      },
      {
        name: "Dumbbell Preacher Curls",
        weight: 22.5,
        reps: 10,
        sets: 3,
        drops: "20 × 12, 17.5 × 12, 15 × 12, 12.5 × 12, 10 × 12, 7.5 × 12, 5 × 12"
      },
      {
        name: "Seated Dumbbell Curls",
        weight: 17.5,
        reps: 10,
        sets: 3,
        drops: "15 × 12, 12.5 × 12, 10 × 12, 7.5 × 12, 5 × 12"
      },
      {
        name: "Hammer Curls",
        weight: 17.5,
        reps: 10,
        sets: 3,
        drops: "15 × 12, 12.5 × 12, 10 × 12, 7.5 × 12, 5 × 12"
      }
    ]
  },

  legs: {
    title: "🦵 Leg Day",
    exercises: [
      {
        name: "Squats",
        weight: 175,
        reps: 10,
        sets: 3,
        drops: "165 × 12, 155 × 12, 145 × 12, 135 × 12, 125 × 12, 115 × 12, 105 × 12, 95 × 12, 85 × 12, 75 × 12, 65 × 12, 55 × 12, 45 × 12"
      },
      {
        name: "Deadlift",
        weight: 135,
        reps: 10,
        sets: 3,
        drops: "115 × 12, 95 × 12, 65 × 12"
      },
      {
        name: "Dumbbell Calf Raises",
        weight: 105,
        reps: 20,
        sets: 3,
        drops: "100 × 20 × 3, 90 × 20 × 3"
      }
    ]
  },

  shoulders: {
    title: "🏋️ Shoulders",
    exercises: []
  },

  core: {
    title: "🔥 Core",
    exercises: []
  }

};


let currentWorkout = null;


function showWorkout(type) {

  currentWorkout = type;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("workout").classList.remove("hidden");

  document.getElementById("workoutTitle").innerText =
    workouts[type].title;

  renderExercises(type);
}


function renderExercises(type) {

  const list = document.getElementById("exerciseList");

  list.innerHTML = "";

  if (workouts[type].exercises.length === 0) {

    list.innerHTML =
      "<p>We'll build this workout next.</p>";

    return;
  }


  workouts[type].exercises.forEach((exercise, index) => {

    let html = `
      <div class="exercise">

        <h3>${exercise.name}</h3>

        <div class="last">
          Last workout:
          <strong>${exercise.weight} lb × ${exercise.reps}</strong>
          × ${exercise.sets}
        </div>

        <button onclick="fillExercise(${index})">
          🔄 Same as Last Workout
        </button>

        <div id="sets-${index}">
    `;


    for (let i = 1; i <= exercise.sets; i++) {

      html += `
        <div class="set">

          <input
            type="checkbox"
            id="check-${index}-${i}"
          >

          Set ${i}

          <input
            type="number"
            value="${exercise.weight}"
            id="weight-${index}-${i}"
          >

          lb

          <input
            type="number"
            value="${exercise.reps}"
            id="reps-${index}-${i}"
          >

          reps

        </div>
      `;

    }


    html += `
        </div>

        <p class="last">
          Drop sets: ${exercise.drops}
        </p>

      </div>
    `;

    list.innerHTML += html;

  });

}


function fillExercise(index) {

  const exercise = workouts[currentWorkout].exercises[index];

  for (let i = 1; i <= exercise.sets; i++) {

    document.getElementById(
      `weight-${index}-${i}`
    ).value = exercise.weight;

    document.getElementById(
      `reps-${index}-${i}`
    ).value = exercise.reps;

  }

}


function sameAsLast() {

  workouts[currentWorkout].exercises.forEach(
    (exercise, index) => {

      fillExercise(index);

    }
  );

}


function finishWorkout() {

  alert(
    "🔥 Workout Complete!\n\n" +
    "Great work. Your workout has been recorded."
  );

}


function goHome() {

  document.getElementById("workout").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");

}


</script>

</body>
</html>

body {

.set-row {

.drop-set {

.empty {

.exercise-input {

    margin-bottom: 15px;

.exercise-input h3 {

}

.set-input {

    margin: 6px 0;

.set-input input[type="number"] {

    border: 1px solid #444;
    color: white;
    border-radius: 5px;
    padding: 9px;
    font-size: 15px;

.set-input input[type="checkbox"] {

    height: 20px;
}

.set-label {

    font-size: 13px;
}

.drop-display {
    margin-top: 14px;
    border-top: 1px solid #333;
    padding-top: 10px;
}

.drop-display-title {
    font-size: 13px;
    font-weight: bold;
    color: #aaa;
    letter-spacing: 1px;
    margin-bottom: 6px;
}

.drop-pill {
    display: inline-block;
    background: #252525;
    border-radius: 6px;
    padding: 7px 9px;
    margin: 3px;
    color: #ccc;
    font-size: 13px;

.cardio-box {

    border-radius: 8px;
    padding: 15px;
    margin: 15px 0;

.cardio-box label {

.cardio-box input {

    height: 20px;

.coach-box {

    border-radius: 10px;
    padding: 18px;
    margin: 15px 0 20px;

.coach-box h3 {

.coach-recommendation {

@media (max-width: 600px) {

/* =========================================================
   HELPERS
   ========================================================= */

function clone(obj) {
    return JSON.parse(JSON.stringify(obj));
}

function makeSets(exercise) {

    const sets = [];

    for (let i = 0; i < exercise.sets; i++) {

        sets.push({
            weight: exercise.weight,
            reps: exercise.reps,
            completed: true
        });

    }

    if (exercise.additionalSets) {

        exercise.additionalSets.forEach(group => {

            for (let i = 0; i < group.sets; i++) {

                sets.push({
                    weight: group.weight,
                    reps: group.reps,
                    completed: true
                });

            }

        });

    }

    return sets;
}

function makeExerciseRecord(exercise) {

    return {
        name: exercise.name,
        sets: makeSets(exercise),
        drops: exercise.drops
            ? clone(exercise.drops)
            : []
    };
}

function makeWorkoutRecord(date, type, sourceTemplate) {

    return {
        id: "seed-" + date + "-" + type,
        date: date,
        type: type,
        name: sourceTemplate.name,
        exercises:
            sourceTemplate.exercises.map(
                makeExerciseRecord
            ),
        cardio: {
            minutes: 30,
            completed: true
        }
    };
}

/* =========================================================
   HISTORY LOAD / MERGE
   ========================================================= */

function getHistory() {

    let saved = [];

    try {

        saved =
            JSON.parse(
                localStorage.getItem(STORAGE_KEY)
            ) || [];

    } catch (e) {

        saved = [];

    }

    const seed = buildSeedHistory();

    const existingKeys = new Set(
        saved.map(
            workout =>
                `${workout.date}|${workout.type}`
        )
    );

    seed.forEach(workout => {

        const key =
            `${workout.date}|${workout.type}`;

        if (!existingKeys.has(key)) {

            saved.push(workout);

        }

    });

    saved.sort(
        (a,b) =>
            new Date(b.date) -
            new Date(a.date)
    );

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(saved)
    );

    return saved;
}

function saveHistory(history) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(history)
    );
}


/* =========================================================
   IRON COACH
   ========================================================= */

function getLastWorkout(history, type) {

    return history.find(
        workout =>
            workout.type === type
    );
}


function getPreviousWorkout(
    history,
    type,
    beforeDate
) {

    return history.find(
        workout =>
            workout.type === type &&
            workout.date < beforeDate
    );
}


function allMainSetsCompleted(exercise) {

    if (!exercise || !exercise.sets) {
        return false;
    }

    return exercise.sets.length > 0 &&
        exercise.sets.every(
            set => set.completed
        );
}


function getMainWeight(exercise) {

    if (!exercise || !exercise.sets || !exercise.sets.length) {
        return 0;
    }

    return Number(
        exercise.sets[0].weight || 0
    );
}


function getMainReps(exercise) {

    if (!exercise || !exercise.sets || !exercise.sets.length) {
        return 0;
    }

    return Number(
        exercise.sets[0].reps || 0
    );
}


function getCoachIncrease(exerciseName, type) {

    const name = (exerciseName || "").toLowerCase();

    if (name.includes("cable")) {
        return 10;
    }

    if (type === "legs") {

        if (
            name.includes("squat") ||
            name.includes("deadlift")
        ) {
            return 10;
        }

        return 5;
    }

    return 5;
}


function getCoachRecommendation(
    history,
    type,
    exercise
) {

    const last =
        getLastWorkout(
            history,
            type
        );

    if (!last) {
        return null;
    }

    const lastExercise =
        last.exercises.find(
            e => e.name === exercise.name
        );

    if (!lastExercise) {
        return null;
    }

    const previous =
        getPreviousWorkout(
            history,
            type,
            last.date
        );

    const lastWeight =
        getMainWeight(lastExercise);

    const lastReps =
        getMainReps(lastExercise);

    const completed =
        allMainSetsCompleted(
            lastExercise
        );


    /*
       If the last workout was not fully completed,
       Coach recommends staying at the same weight.
    */

    if (!completed) {

        return {
            exercise: exercise.name,

            html:
                `Last: <strong>${lastWeight} lbs Ã— ${lastReps}</strong>.<br>
                 Some main sets were not completed.
                 <strong>Stay at ${lastWeight} lbs</strong>
                 and build the reps before increasing.`
        };
    }


    /*
       Check whether the user has repeated the same
       weight across multiple workouts.
    */

    let repeatedWeight = false;

    if (previous) {

        const previousExercise =
            previous.exercises.find(
                e => e.name === exercise.name
            );

        if (previousExercise) {

            const previousWeight =
                getMainWeight(
                    previousExercise
                );

            if (
                previousWeight === lastWeight &&
                lastWeight > 0
            ) {

                repeatedWeight = true;

            }
        }
    }


    /*
       If the user has held the same weight across
       multiple workouts, recommend progression.
    */

    if (repeatedWeight) {

        const increase =
            getCoachIncrease(
                exercise.name,
                type
            );

        const suggestedWeight =
            lastWeight + increase;

        return {
            exercise: exercise.name,

            html:
                `Last: <strong>${lastWeight} lbs Ã— ${lastReps}</strong>.<br>
                 You've successfully held this weight across
                 multiple workouts.<br>
                 <strong>Coach: Try ${suggestedWeight} lbs today.</strong><br>
                 If all main sets feel strong, keep building at
                 ${suggestedWeight} lbs.`
        };
    }


    /*
       First successful workout at this weight.
    */

    return {
        exercise: exercise.name,

        html:
            `Last: <strong>${lastWeight} lbs Ã— ${lastReps}</strong>.<br>
             Complete all your main sets at this weight again.
             If they feel strong, Coach will look for a
             progression opportunity next time.`
    };
}


function buildCoachBox(history, type) {

    const template =
        templates[type];

    const recommendations = [];

    /*
       Focus Coach on the first few major movements
       so the advice stays clean and useful.
    */

    template.exercises.forEach(
        exercise => {

            if (
                recommendations.length < 3
            ) {

                const recommendation =
                    getCoachRecommendation(
                        history,
                        type,
                        exercise
                    );

                if (recommendation) {

                    recommendations.push(
                        recommendation
                    );

                }

            }

        }
    );


    if (!recommendations.length) {

        return `
            <div class="coach-box">

                <h3>ðŸ¤– IRON COACH</h3>

                <p>
                    Finish your first workout and Coach
                    will start learning your numbers.
                </p>

            </div>
        `;
    }


    let html = `
        <div class="coach-box">

            <h3>ðŸ¤– IRON COACH</h3>

            <p>
                Here's what Coach sees from your recent history:
            </p>
    `;


    recommendations.forEach(
        recommendation => {

            html += `

                <div class="coach-recommendation">

                    <div class="coach-exercise">
                        ${recommendation.exercise}
                    </div>

                    <div class="coach-advice">
                        ${recommendation.html}
                    </div>

                </div>

            `;

        }
    );


    html += `

            <div class="coach-small">
                Coach starts conservative. Complete your
                main sets with good form before increasing.
                When you move up, your previous working weight
                can become the top of your drop-set ladder.
            </div>

        </div>
    `;

    return html;
}


/* =========================================================
   DROP SET DISPLAY
   ========================================================= */

function buildDropWeights(exercise, lastExercise, currentMainWeight) {

    const drops = exercise && exercise.drops
        ? clone(exercise.drops)
        : [];

    const oldMain = lastExercise
        ? Number(getMainWeight(lastExercise) || 0)
        : 0;

    const newMain = Number(
        currentMainWeight ??
        (exercise ? exercise.weight : 0) ??
        0
    );

    if (oldMain > 0 && newMain > oldMain) {
        return [
            oldMain,
            ...drops.filter(
                weight => Number(weight) !== oldMain
            )
        ];
    }

    return drops;
}


function buildDropDisplay(exercise, lastExercise, currentMainWeight) {

    const drops = buildDropWeights(
        exercise,
        lastExercise,
        currentMainWeight
    );

    if (!drops.length) {
        return `
            <div class="drop-display">
                <div class="drop-display-title">DROP SETS</div>
                <div class="set-row drop-set">No drop sets</div>
            </div>
        `;
    }

    let html = `
        <div class="drop-display">
            <div class="drop-display-title">DROP SETS</div>
    `;

    drops.forEach(weight => {
        html += `
            <span class="drop-pill">
                ${weight} lbs Ã— 12
            </span>
        `;
    });

    html += `</div>`;
    return html;
}


function updateDropDisplayForExercise(type, exerciseIndex) {

    const template = templates[type];

    if (!template || !template.exercises[exerciseIndex]) {
        return;
    }

    const exercise = template.exercises[exerciseIndex];
    const history = getHistory();
    const lastWorkout = getLastWorkout(history, type);

    let lastExercise = null;

    if (lastWorkout && lastWorkout.exercises) {
        lastExercise =
            lastWorkout.exercises.find(
                e => e.name === exercise.name
            ) ||
            lastWorkout.exercises[exerciseIndex] ||
            null;
    }

    const weightInput =
        document.getElementById(
            `weight-${exerciseIndex}-0`
        );

    const currentMainWeight =
        weightInput
            ? Number(weightInput.value || 0)
            : Number(exercise.weight || 0);

    const target =
        document.getElementById(
            `drop-display-${exerciseIndex}`
        );

    if (target) {
        target.innerHTML =
            buildDropDisplay(
                exercise,
                lastExercise,
                currentMainWeight
            );
    }
}


function updateAllDropDisplays(type) {

    const template = templates[type];

    if (!template) {
        return;
    }

    template.exercises.forEach(
        (exercise, exerciseIndex) => {
            updateDropDisplayForExercise(
                type,
                exerciseIndex
            );
        }
    );
}


/* =========================================================
   DASHBOARD
   ========================================================= */

function showDashboard() {

    const history =
        getHistory();

    const cardioMinutes =
        history.reduce(
            (total, workout) => {

                return total +
                    (
                        workout.cardio &&
                        workout.cardio.completed
                            ? Number(
                                workout.cardio.minutes || 0
                            )
                            : 0
                    );

            },
            0
        );

    const app =
        document.getElementById(

/* =========================================================
   STREAK
   ========================================================= */

function calculateStreak(history) {

    if (!history.length) {
        return 0;
    }

    const dates =
        [
            ...new Set(
                history.map(
                    workout => workout.date
                )
            )
        ].sort().reverse();


    let streak = 0;

    let current =
        new Date();

    current.setHours(
        0,0,0,0
    );


    for (
        let i = 0;
        i < dates.length;
        i++
    ) {

        const workoutDate =
            new Date(
                dates[i] +
                "T00:00:00"
            );

        const diff =
            Math.round(
                (
                    current -
                    workoutDate
                ) /
                (
                    1000 *
                    60 *
                    60 *
                    24
                )
            );


        if (
            i === 0 &&
            diff > 1
        ) {
            break;
        }


        if (
            diff === 0 ||
            diff === 1
        ) {

            streak++;

            current =
                workoutDate;

        } else {

            break;

        }

    }

    return streak;
}


/* =========================================================
   START WORKOUT
   ========================================================= */

function startWorkout(type) {

    const template =
        templates[type];

    const history =
        getHistory();


    const lastWorkout =
        getLastWorkout(
            history,
            type
        );


    const app =
        document.getElementById(
            "app"
        );


    let exercisesHTML = "";


    template.exercises.forEach(
        (
            exercise,
            exerciseIndex
        ) => {

            let sourceExercise =
                null;


            if (
                lastWorkout &&
                lastWorkout.exercises
            ) {

                sourceExercise =
                    lastWorkout.exercises.find(
                        e =>
                            e.name ===
                            exercise.name
                    );

            }


            /*
               Position fallback for exercise names
               that changed slightly.
            */

            if (
                !sourceExercise &&
                lastWorkout &&
                lastWorkout.exercises &&
                lastWorkout.exercises[
                    exerciseIndex
                ]
            ) {

                sourceExercise =
                    lastWorkout.exercises[
                        exerciseIndex
                    ];

            }


            const sets =
                sourceExercise
                    ? sourceExercise.sets
                    : makeSets(exercise);


            let setsHTML = "";


            sets.forEach(
                (
                    set,
                    setIndex
                ) => {

                    setsHTML += `

                        <div class="set-input">

                            <input
                                type="checkbox"
                                id="check-${exerciseIndex}-${setIndex}"
                                ${
                                    sourceExercise &&
                                    set.completed
                                        ? "checked"
                                        : ""
                                }
                            >


                            <input
                                type="number"
                                id="weight-${exerciseIndex}-${setIndex}"
                                value="${set.weight}"
                                step="2.5"
                            >


                            <input
                                type="number"
                                id="reps-${exerciseIndex}-${setIndex}"
                                value="${set.reps}"
                            >

                        </div>

                    `;

                }
            );


            /*
               Make the drop-set ladder visible right
               underneath the main sets.
            */

            const currentMainWeight =
                sets[0]
                    ? Number(sets[0].weight || 0)
                    : Number(exercise.weight || 0);

            const dropDisplay =
                buildDropDisplay(
                    exercise,
                    sourceExercise,
                    currentMainWeight
                );


            exercisesHTML += `

                <div
                    class="exercise-input"
                    data-exercise-index="${exerciseIndex}"
                >

                    <h3>
                        ${exercise.name}
                    </h3>


                    <div class="set-label">
                        CHECKED = COMPLETED
                    </div>


                    ${setsHTML}


                    <div id="drop-display-${exerciseIndex}">
                        ${dropDisplay}
                    </div>

                </div>

            `;

        }
    );


    const cardioChecked =
        lastWorkout &&
        lastWorkout.cardio &&
        lastWorkout.cardio.completed
            ? "checked"
            : "";


    app.innerHTML = `

        <button
            class="back-button"
            onclick="showDashboard()"
        >
            â† Back
        </button>


        <h2>
            ${template.name}
        </h2>


        ${buildCoachBox(
            history,
            type
        )}


        <button
            class="primary"
            onclick="sameAsLastWorkout('${type}')"
        >
            ðŸ” Same as Last Workout
        </button>


        ${exercisesHTML}


        <div class="cardio-box">

            <label>

                <input
                    type="checkbox"
                    id="cardio-check"
                    ${cardioChecked}
                >

                30 Minutes Exercise Bike

            </label>

        </div>


        <button
            class="primary"
            onclick="finishWorkout('${type}')"
        >
            âœ… Finish Workout
        </button>

    `;

    template.exercises.forEach(
        (exercise, exerciseIndex) => {

            const weightInput =
                document.getElementById(
                    `weight-${exerciseIndex}-0`
                );

            if (weightInput) {
                weightInput.addEventListener(
                    "input",
                    () => updateDropDisplayForExercise(
                        type,
                        exerciseIndex
                    )
                );

                weightInput.addEventListener(
                    "change",
                    () => updateDropDisplayForExercise(
                        type,
                        exerciseIndex
                    )
                );
            }
        }
    );
}


/* =========================================================
   SAME AS LAST WORKOUT
   ========================================================= */

function sameAsLastWorkout(type) {

    const history =
        getHistory();


    const lastWorkout =
        getLastWorkout(
            history,
            type
        );


    if (!lastWorkout) {

        alert(
            "No previous workout found."
        );

        return;
    }


    lastWorkout.exercises.forEach(
        (
            exercise,
            exerciseIndex
        ) => {

            exercise.sets.forEach(
                (
                    set,
                    setIndex
                ) => {

                    const weight =
                        document.getElementById(
                            `weight-${exerciseIndex}-${setIndex}`
                        );


                    const reps =
                        document.getElementById(
                            `reps-${exerciseIndex}-${setIndex}`
                        );


                    const check =
                        document.getElementById(
                            `check-${exerciseIndex}-${setIndex}`
                        );


                    if (weight) {

                        weight.value =
                            set.weight;

                    }


                    if (reps) {

                        reps.value =
                            set.reps;

                    }


                    if (check) {

                        check.checked =
                            !!set.completed;

                    }

                }
            );

        }
    );


    const cardio =
        document.getElementById(
            "cardio-check"
        );


    if (cardio) {

        cardio.checked =
            !!(
                lastWorkout.cardio &&
                lastWorkout.cardio.completed
            );

    }

    updateAllDropDisplays(type);

    alert(
        `Loaded your ${lastWorkout.name} workout from ${formatDate(lastWorkout.date)}.`
    );
}


/* =========================================================
   FINISH WORKOUT
   ========================================================= */

function getLocalDateString() {

    const now = new Date();

    return `${now.getFullYear()}-${String(
        now.getMonth() + 1
    ).padStart(2, "0")}-${String(
        now.getDate()
    ).padStart(2, "0")}`;
}


function finishWorkout(type) {

    const template = templates[type];
    const today = getLocalDateString();
    const history = getHistory();

    const previousWorkout =
        getPreviousWorkout(
            history,
            type,
            today
        );

    const exercises = [];

    template.exercises.forEach(
        (exercise, exerciseIndex) => {

            const sets = [];
            let setIndex = 0;

            while (
                document.getElementById(
                    `weight-${exerciseIndex}-${setIndex}`
                )
            ) {

                const weight =
                    document.getElementById(
                        `weight-${exerciseIndex}-${setIndex}`
                    ).value;

                const reps =
                    document.getElementById(
                        `reps-${exerciseIndex}-${setIndex}`
                    ).value;

                const completed =
                    document.getElementById(
                        `check-${exerciseIndex}-${setIndex}`
                    ).checked;

                sets.push({
                    weight: Number(weight),
                    reps: Number(reps),
                    completed: completed
                });

                setIndex++;
            }

            const previousExercise =
                previousWorkout &&
                previousWorkout.exercises
                    ? (
                        previousWorkout.exercises.find(
                            e => e.name === exercise.name
                        ) ||
                        previousWorkout.exercises[exerciseIndex] ||
                        null
                    )
                    : null;

            const currentMainWeight =
                sets.length
                    ? Number(sets[0].weight || 0)
                    : Number(exercise.weight || 0);

            exercises.push({
                name: exercise.name,
                sets: sets,
                drops: buildDropWeights(
                    exercise,
                    previousExercise,
                    currentMainWeight
                )
            });
        }
    );

    const workout = {
        id: "workout-" + Date.now(),
        date: today,
        type: type,
        name: template.name,
        exercises: exercises,
        cardio: {
            minutes: 30,
            completed:
                document.getElementById(
                    "cardio-check"
                ).checked
        }
    };

    const existingIndex =
        history.findIndex(
            w =>
                w.date === today &&
                w.type === type
        );

    if (existingIndex >= 0) {
        history[existingIndex] = workout;
    } else {
        history.push(workout);
    }

    history.sort(
        (a, b) =>
            new Date(b.date) -
            new Date(a.date)
    );

    saveHistory(history);

    alert("Workout saved! ðŸ’ª");

    showDashboard();
}

/* =========================================================
   HISTORY TOGGLE
   ========================================================= */

function toggleHistory(index) {

    const element =
        document.getElementById(
            `history-${index}`
        );


    if (element) {

        element.classList.toggle(
            "open"
        );

    }
}


/* =========================================================
   DATE FORMAT
   ========================================================= */

function formatDate(dateString) {

    const date =
        new Date(
            dateString +
            "T00:00:00"
        );


    return date.toLocaleDateString(
        "en-US",
        {
            month: "short",
            day: "numeric",
            year: "numeric"
        }
    );
}
